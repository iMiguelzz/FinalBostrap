<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Mikiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="icon" href="./assets/img/icono.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-md navbar-dark bg-black">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="assets/img/icono.jpg" alt="Mikiz" height="30"> Mikiz
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
    <main class="container my-4">
        <div class="row g-4 align-items-center">
        <div class="col-12 col-md-5 text-center">
            <img src="assets/img/logo.jpg" class="img-fluid rounded" alt="Logo Mikiz">
            <p class="lead mt-3">Tu pasión, tus zapatillas</p>
        </div>
        <div class="col-12 col-md-7">
            <div class="columnas rounded">
                <h1 class="h3 text-center mb-1"><i class="bi bi-bag-heart"></i> Haz tu pedido</h1>
                <p class="text-center text-white-50 mb-4">Cuéntanos qué zapatilla buscas y te respondemos pronto.</p>
                    <form>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="nombre" class="form-label"><i class="bi bi-person"></i> Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="telefono" class="form-label"><i class="bi bi-telephone"></i> Número de teléfono</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Tu número" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="talla" class="form-label"><i class="bi-arrows-expand"></i> Talla</label>
                                <select class="form-select" id="talla" required>
                                    <option value="" selected disabled>Elige tu talla</option>
                                    <option>38</option>
                                    <option>39</option>
                                    <option>40</option>
                                    <option>41</option>
                                    <option>42</option>
                                    <option>43</option>
                                    <option>44</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="modelo" class="form-label"><i class="bi bi-tag"></i> Modelo de zapatilla</label>
                                <select class="form-select" id="modelo" required>
                                    <option value="" selected disabled>Elige una categoría</option>
                                    <option>Urbanas</option>
                                    <option>Deportivas</option>
                                    <option>De vestir</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="mensaje" class="form-label"><i class="bi bi-chat-dots"></i> ¿Qué estás buscando?</label>
                                <textarea class="form-control" id="mensaje" rows="4"
                                    placeholder="Describe el modelo, color y cualquier detalle que quieras" required></textarea>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-light btn-lg rounded-pill">
                                    <i class="bi bi-send"></i> Enviar pedido
                                </button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
    <footer class="bg-black py-4 mt-4">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-12 col-md-6 text-center text-md-start">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-3">
                        <img src="assets/img/icono.jpg" alt="Mikiz" height="40">
                        <p class="mb-0">Tu pasión, tus zapatillas</p>
                    </div>
                </div>
                <div class="col-12 col-md-6 text-center text-md-end">
                    <p class="mb-2">Síguenos en redes</p>
                    <div class="mb-2">
                        <a href="#" class="text-white mx-2"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-white mx-2"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="text-white mx-2"><i class="bi bi-whatsapp"></i></a>
                    </div>
                    <small class="text-white-50"> 2026 Mikiz. Todos los derechos reservados.</small>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
